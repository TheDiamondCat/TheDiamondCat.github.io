<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheDiamondCat</title>
<style>
:root{--bg:#0f0c1d;--card:#1b1730;--ink:#f3f0ff;--muted:#b9b2d6;--accent:#8f7cff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 4px;font-size:32px}
p{color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:20px;margin-top:24px}
.card h2{margin:0 0 6px;font-size:22px}
a{color:var(--accent)}
.btn{display:inline-block;margin-top:8px;padding:10px 18px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
footer{margin-top:40px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>TheDiamondCat</h1>
  <p>Independent game developer.</p>
  <section class="card">
    <h2>💎 Crystal Caverns</h2>
    <p>A relaxing idle mining game where every tap plays the next note of the crystal's song. Travel a map of 20 glowing worlds and join a new Rhythm Tour every month.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.crystalcaverns.game">Get it on Google Play</a>
  </section>
  <footer>Contact: <a href="mailto:crystalcaverns.support@gmail.com">crystalcaverns.support@gmail.com</a></footer>
</main>
</body>
</html>
